version: '3.8'
services:
  database:
    image: postgres:15-alpine
    environment:
      # SEGURANÇA: Chaves expostas estaticamente removidas. Depende estritamente do arquivo .env no SO Host.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
  
  scraper:
    build: .
    depends_on:
      database:
        condition: service_healthy
    environment:
      - DB_HOST=database
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - LOCAL_UID=${UID:-1000}
      - LOCAL_GID=${GID:-1000}
    volumes:
      - ./data:/app/data

volumes:
  pgdata:
