version: '3.8'
services:
  database:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adminpassword}
      POSTGRES_DB: ${POSTGRES_DB:-scraper_db}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-scraper_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
  
  scraper:
    build: .
    depends_on:
      database:
        condition: service_healthy
    environment:
      - DB_HOST=database
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-adminpassword}
      - POSTGRES_DB=${POSTGRES_DB:-scraper_db}
      - LOCAL_UID=${UID:-1000}
      - LOCAL_GID=${GID:-1000}
    volumes:
      - ./data:/app/data

volumes:
  pgdata:
