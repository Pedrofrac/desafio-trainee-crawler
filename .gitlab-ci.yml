# Definimos a sequência das etapas que o GitLab vai rodar
stages:
  - lint
  - test
  - build
  - deploy

# Configuração de Cache para acelerar os builds futuros do Go (Diferencial bônus do PDF)
cache:
  paths:
    - .go-cache/
    - /go/pkg/mod/

variables:
  GOPATH: "$CI_PROJECT_DIR/.go-cache"

# ==========================================
# STAGE 1: LINT (Garante boas práticas de código)
# ==========================================
lint:
  stage: lint
  image: golangci/golangci-lint:v1.59-alpine
  script:
    # Roda o linter oficial do Go. Se houver erro de sintaxe ou boas práticas, a pipeline para aqui.
    - golangci-lint run --timeout 5m

# ==========================================
# STAGE 2: TEST (Roda os testes unitários que criamos)
# ==========================================
test:
  stage: test
  image: golang:alpine
  script:
    # Executa os testes unitários do arquivo main_test.go
    - go test -v ./...

# ==========================================
# STAGE 3: BUILD (Gera a imagem Docker e envia para o registro do GitLab)
# ==========================================
build:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind # Permite rodar Docker dentro do GitLab
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    # 1. Faz login no registro do GitLab usando as variáveis seguras e nativas do próprio GitLab
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    
    # 2. Constrói a imagem Docker usando nosso Dockerfile
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA -t $CI_REGISTRY_IMAGE:latest .
    
    # 3. Envia (Push) as imagens com a tag do commit atual e a tag 'latest'
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE:latest

# ==========================================
# STAGE 4: DEPLOY (Simula o deploy na AWS ECS)
# ==========================================
deploy:
  stage: deploy
  image: alpine:latest
  script:
    # Simulação de comandos reais do AWS CLI para atualizar o serviço no ECS (Requisito do PDF)
    - echo "=== INICIANDO SIMULAÇÃO DE DEPLOY NO AWS ECS ==="
    - echo "Conectando na AWS usando variáveis de ambiente..."
    - echo "Executando: aws ecs update-service --cluster ecs-trainee-cluster --service scraper-service --force-new-deployment"
    - echo "Aguardando estabilização do serviço..."
    - echo "=== DEPLOY FINALIZADO COM SUCESSO NO AWS ECS! ==="
  rules:
    # Regra importante do PDF: O deploy só deve rodar quando o código for mesclado na branch 'main'
    - if: $CI_COMMIT_BRANCH == "main"