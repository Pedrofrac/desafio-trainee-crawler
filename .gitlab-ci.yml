stages:
  - lint
  - test
  - build
  - deploy

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  GOPATH: "$CI_PROJECT_DIR/.go"

cache:
  paths:
    - .go/pkg/mod/

lint:
  stage: lint
  image: golangci/golangci-lint:v1.59-alpine
  script:
    - golangci-lint run --timeout 5m

test:
  stage: test
  image: golang:alpine
  script:
    - go test -v main.go main_test.go

build:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    # Otimizacao de Build: Tenta puxar a imagem mais recente do Registry para servir de cache
    - docker pull $CI_REGISTRY_IMAGE:latest || true
    # Compilacao otimizada usando cache de camadas intermediarias do Dockerfile
    - docker build --cache-from $CI_REGISTRY_IMAGE:latest -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA -t $CI_REGISTRY_IMAGE:latest .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE:latest

deploy:
  stage: deploy
  image: alpine:latest
  script:
    - echo "Iniciando deploy no ambiente de Producao..."
    - echo "Deploy executado com sucesso!"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
