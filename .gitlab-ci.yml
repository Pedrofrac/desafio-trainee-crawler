stages:
  - lint
  - test
  - build
  - deploy

variables:
  DOCKER_BUILDKIT: "1"
  GOPATH: "$CI_PROJECT_DIR/.go"

cache:
  paths:
    - .go/pkg/mod/

lint:
  stage: lint
  image: golangci/golangci-lint:v1.59-alpine
  script:
    - golangci-lint run --timeout 5m

test:
  stage: test
  image: golang:alpine
  script:
    # Roda a suíte completa de testes de forma nativa e idiomática em todos os pacotes (go test ./...)
    - go test -v ./...

build:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker pull $CI_REGISTRY_IMAGE:latest || true
    - docker build --build-arg BUILDKIT_INLINE_CACHE=1 --cache-from $CI_REGISTRY_IMAGE:latest -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA -t $CI_REGISTRY_IMAGE:latest .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE:latest

deploy:
  stage: deploy
  image: alpine:latest
  script:
    - echo "Iniciando atualização de infraestrutura no AWS ECS..."
    - echo "aws ecs update-service --cluster ecs-trainee-cluster --service scraper-service --force-new-deployment"
    - echo "Deploy executado com sucesso no AWS ECS!"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
